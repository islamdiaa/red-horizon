<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Red Horizon</title>
    <meta name="description" content="Red Horizon - a Cold War real-time strategy game in your browser. Works offline." />
    <!-- link previews (Discord, WhatsApp, X, Slack...): og:image becomes absolute when RH_SITE_URL is set at build time (vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Red Horizon" />
    <meta property="og:title" content="Red Horizon - Cold War RTS in your browser" />
    <meta property="og:description" content="Build a base, harvest ore and command Allied or Soviet armies: Tesla coils, Mammoth tanks, navies and nukes in real-time 3D. Free, no install, works offline." />
    <meta property="og:image" content="/og/red-horizon-1200x630.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Red Horizon: Soviet Tesla coils guard a snowy base as Allied tanks attack at dusk" />
    <!-- og:url -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Red Horizon - Cold War RTS in your browser" />
    <meta name="twitter:description" content="Build a base, harvest ore and command Allied or Soviet armies in real-time 3D. Free, no install, works offline." />
    <meta name="twitter:image" content="/og/red-horizon-1200x630.jpg" />
    <meta name="twitter:image:alt" content="Red Horizon: Soviet Tesla coils guard a snowy base as Allied tanks attack at dusk" />
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Red Horizon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" href="/fonts/rajdhani-600.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Self-hosted fonts (SIL Open Font License 1.1, see public/fonts/OFL.txt): no third-party requests.
         Declared here rather than in src/ so Vite rewrites the URLs for any base (/, /sub/, ./). */
      @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/rajdhani-500.woff2') format('woff2'); }
      @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/rajdhani-600.woff2') format('woff2'); }
      @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/rajdhani-700.woff2') format('woff2'); }
      @font-face { font-family: 'Share Tech Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/share-tech-mono-400.woff2') format('woff2'); }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="loading">
      <div class="ld-grid"></div>
      <div class="ld-glow"></div>
      <div class="ld-center">
        <div class="ld-mark">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />
            <circle cx="50" cy="50" r="44" fill="none" stroke="#ff5a3a" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 207" />
            <circle cx="50" cy="50" r="34" fill="none" stroke="#ffb08a" stroke-width="2" stroke-linecap="round" stroke-dasharray="30 184" stroke-dashoffset="-90" opacity="0.7" />
            <path d="M50 30l5.9 12.1 13.1 1.9-9.5 9.3 2.2 13.1L50 60.2l-11.7 6.2 2.2-13.1-9.5-9.3 13.1-1.9z" fill="#ff6a46" />
          </svg>
        </div>
        <div class="ld-title">RED <span>HORIZON</span></div>
        <div class="ld-sub">A Cold War Real-Time Strategy</div>
      </div>
      <div class="ld-bottom">
        <div class="ld-row"><span class="label">LOADING</span><span class="ld-pct"></span></div>
        <div class="bar"><div></div></div>
        <div class="ld-tip"><span class="ld-tip-k">Field tip</span><span class="ld-tip-t">Ore regrows over time — gem fields are worth twice as much as ore.</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
