# WebSocket upgrades for the multiplayer relay (location /relay/ below)
map $http_upgrade $rh_connection_upgrade {
  default upgrade;
  ''      close;
}

# Access log without client addresses or user agents: docs/MULTIPLAYER.md promises that addresses are never logged
# (the relay keeps them in memory for rate limits only), and this nginx sees every player's /relay/ requests too
log_format rh_noaddr '[$time_local] "$request" $status $body_bytes_sent $request_time';

# HD models and terrain textures are requested as <file>?v=<content hash>: those URLs never change content (cache for a
# year); without ?v= (the manifests that list the hashes) they must revalidate
map $arg_v $rh_content_cache {
  ''      "no-cache";
  default "public, max-age=31536000, immutable";
}

server {
  # unprivileged image: nginx runs as a non-root user, so it listens on 8080
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  access_log /var/log/nginx/access.log rh_noaddr;

  gzip on;
  # a cache between nginx and the player must not hand a gzipped body to a client that did not ask for one
  gzip_vary on;
  gzip_comp_level 6;
  # (.glb models compress by about a third; WebP, WOFF2, PNG and JPEG are compressed already)
  gzip_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json model/gltf-binary;

  # only serve the game's own files
  location ~ /\. {
    include /etc/nginx/security-headers.conf;
    deny all;
  }
  # HD content: a missing file is a 404 (not the page), cached by its ?v= hash
  location ~* ^/models/.+\.glb$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $rh_content_cache;
    types { }
    default_type model/gltf-binary;
    try_files $uri =404;
  }
  location ~ ^/(?:models|textures)/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $rh_content_cache;
    try_files $uri =404;
  }

  # hashed bundles never change: cache forever
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # fonts keep their names across builds, and the CJK subset is rebuilt whenever new text needs new glyphs: revalidate
  # (a 304 when unchanged; with the service worker, the game reads them from its own cache)
  location /fonts/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  # the page, service worker and manifest must always be revalidated so updates arrive
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    include /etc/nginx/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  # Multiplayer relay and verified leaderboards: the `relay` service of docker-compose.yml (docs/MULTIPLAYER.md).
  # Same origin for the browser, so the CSP keeps connect-src 'self'. The name is resolved per request through
  # Docker's DNS: the game also runs without the relay (these requests then answer 502).
  location /relay/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cache-Control;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $rh_relay http://relay:8787;
    proxy_pass $rh_relay;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $rh_connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    client_max_body_size 2m;
  }
  # everything else (icons, the mod list, link-preview images, the page for any other path) has a fixed name: revalidate
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
