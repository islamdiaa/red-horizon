server {
  # unprivileged image: nginx runs as a non-root user, so it listens on 8080
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # only serve the game's own files
  location ~ /\. { deny all; }

  # hashed bundles never change: cache forever
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # fonts keep their names across builds: cache for a month
  location /fonts/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
  # the page, service worker and manifest must always be revalidated so updates arrive
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    include /etc/nginx/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
