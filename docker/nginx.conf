# WebSocket upgrades for the multiplayer relay (location /relay/ below)
map $http_upgrade $rh_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  # unprivileged image: nginx runs as a non-root user, so it listens on 8080
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # only serve the game's own files
  location ~ /\. { deny all; }

  # hashed bundles never change: cache forever
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # fonts keep their names across builds: cache for a month
  location /fonts/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
  # the page, service worker and manifest must always be revalidated so updates arrive
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    include /etc/nginx/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  # Multiplayer relay and verified leaderboards: the `relay` service of docker-compose.yml (docs/MULTIPLAYER.md).
  # Same origin for the browser, so the CSP keeps connect-src 'self'. The name is resolved per request through
  # Docker's DNS: the game also runs without the relay (these requests then answer 502).
  location /relay/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cache-Control;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $rh_relay http://relay:8787;
    proxy_pass $rh_relay;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $rh_connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    client_max_body_size 2m;
  }
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
